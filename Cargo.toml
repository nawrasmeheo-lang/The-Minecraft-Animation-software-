[package]
name = "appcraft"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29.1"
egui = "0.29.1"
egui_glow = "0.29.1"
glam = "0.29"
rfd = "0.15"
tobj = "4.0"
gltf = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
